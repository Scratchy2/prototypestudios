<html lang="en">
  <head>

    <meta name="google-site-verification" content="jXNDldaCKQmiQbSrea1mugY53_URt1cWGRycDEcwEug" />
    <title>ProtoType Studios</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      #world {
        background: linear-gradient(to right in oklch, hsl(240, 100%, 65%), hsl(140, 100%, 60%));
        color: transparent;
        background-clip: text;
        text-decoration: underline;
        font-weight: bold;
      }

  <body>
    <center>
      <h1 class="large" id="pts">ProtoType Studios</h1>
      <h6 class="medium">One protogen, making prototypes, bettering the <span id="world">world.</span></h6>
      <p><span class="medium" id="welcome"></span><span id="name"></span><span class="medium" id="name2"></span></p><hr>
      <button id="creulette"><div class="prototype">
        <p class="large title">Creulette</p>
        <h6 class="small">Get rewarded for a random color with infinite chances. Epilepsy warning!</h6>
      </div></button><br>
      <button id="dlm"><div class="prototype">
        <p class="large title">DLM() Color Picker</p>
        <h6 class="small">The new way to represent colors with three values: D, L, and M.</h6>
      </div></button><br>
      <button id="rngdle"><div class="prototype">
        <p class="large title">RNGdle Sandbox</p>
        <h6 class="small">An RNGdle EP calculator. Find out how much EP a number might earn. 100% ACCURATE ON RNGDLE V2!!! 🎉</h6>
      </div></button><br>
      <button id="sunclipse"><div class="prototype">
        <p class="large title">Sunclipse</p>
        <h6 class="small">Calculate the position, sunrise, and sunset of the sun. All info stored locally.</h6>
      </div></button><br>
      <button id="rollscapes"><div class="prototype">
        <p class="large title">Rollscapes</p>
        <h6 class="small">Roll 10 dice of 2-100 sides and analyze the probability.</h6>
      </div></button><br>
      <button id="hertzle"><div class="prototype">
        <p class="large title">Hertzle</p>
        <h6 class="small">Test your frequency luck daily in multiple ways!</h6>
      </div></button><br>
      <hr><a class="medium mono" href="https://docs.google.com/spreadsheets/d/1YMs7aei-l5lOZu3yVG_5xdsBzfqzOB_zFAv5gudGrGk">Link to RNGdle Badges. Shift-click to copy the link.</a>
      <hr><footer class="small">© 2026 Milo the Protogen. All rights reserved.</footer>
      <footer class="small"><a href="/privacy">Privacy Policy</a></footer>
      <footer class="small"><a href="/tos">Terms of Service</a></footer>
      <button class="large" id="personalize">Personalize Account</button>
    </center>
    <script>
      function converter(hex) {
      	let r = parseInt(hex.slice(1, 3), 16) / 255;
      	let g = parseInt(hex.slice(3, 5), 16) / 255;
      	let b = parseInt(hex.slice(5, 7), 16) / 255;
      	r = r <= 0.04045 ? r / 12.92 : ((r + 0.055) / 1.055) ** 2.4;
      	g = g <= 0.04045 ? g / 12.92 : ((g + 0.055) / 1.055) ** 2.4;
      	b = b <= 0.04045 ? b / 12.92 : ((b + 0.055) / 1.055) ** 2.4;
      	const l = Math.cbrt(
      		0.4122214708 * r +
      		0.5363325363 * g +
      		0.0514459929 * b
      	);
      	const m = Math.cbrt(
      		0.2119034982 * r +
      		0.6806995451 * g +
      		0.1073969566 * b
      	);
      	const s = Math.cbrt(
      		0.0883024619 * r +
      		0.2817188376 * g +
      		0.6299787005 * b
      	);
      	const L = 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s;
      	const a = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
      	const b2 = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
      	const C = Math.sqrt(a * a + b2 * b2);
      	let H = Math.atan2(b2, a) * 180 / Math.PI;
      	if (H < 0) H += 360;
      	return {l: L, c: C, h: H};
      }
      function gr() {
        g = (g + 0.3) % 360;
        document.querySelector("#creulette").style.background = `linear-gradient(to right, hsl(${g}, 100%, 50%), hsl(${g+36}, 100%, 50%))`;
        document.querySelector("#dlm").style.background = `linear-gradient(to right, hsl(${g}, 100%, 50%), hsl(${g+36}, 100%, 50%))`;
        document.querySelector("#pts").style.background = `linear-gradient(to right, hsl(${g+180}, 100%, 50%), hsl(${g+216}, 100%, 50%))`;
        document.querySelector("#creulette").style.color = `hsl(${g+180}, 100%, 50%)`;
        document.querySelector("#dlm").style.color = `hsl(${g+180}, 100%, 50%)`;
        document.querySelector("#pts").style.color = `transparent`;
        document.querySelector("#pts").style.backgroundClip = `text`;
      }
      let g = 0;
      if (!localStorage.getItem("theme")) {
        localStorage.setItem("theme", "dark");
      }
      window.onload = () => {
        setInterval(gr, 16);
        document.body.classList.add(localStorage.getItem("theme"));
        const account = JSON.parse(localStorage.getItem("account"));
        if (account) {
          document.querySelector("#name").textContent = account.displayname || `user50500`;
          document.querySelector("#name").style.color = account.namecolor || "#00bcbc";
          if (account.namedisplay.includes("bold")) {
            document.querySelector("#name").classList = "large";
          } else {
            document.querySelector("#name").classList = "medium";
          }
          document.querySelector("#name").textContent = account.displayname;
          document.querySelector("#name").style.color = account.namecolor;
          if (account.namedisplay.includes("bold")) {
            document.querySelector("#name").classList = "large";
          } else {
            document.querySelector("#name").classList = "medium";
          }
          if (account.namedisplay.includes("grad")) {
            const oklch = converter(account.namecolor);
            document.querySelector("#name").style.background = `linear-gradient(to right, ${account.namecolor}, oklch(${oklch.l} ${oklch.c} ${oklch.h+Number(account.huedifference)}))`;
            document.querySelector("#name").style.color = "transparent";
            document.querySelector("#name").style.backgroundClip = "text";
          }
          document.querySelector("#welcome").textContent = "Welcome back, ";
          document.querySelector("#name2").textContent = " :3";
        } else {
          localStorage.setItem("account", "{}");
        }
      }
      document.querySelector("#creulette").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/creulette";
      }
      document.querySelector("#dlm").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/dlm";
      }
      document.querySelector("#sunclipse").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/sunclipse";
      }
      document.querySelector("#rngdle").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/rngdle";
      }
      document.querySelector("#rollscapes").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/rollscapes";
      }
      document.querySelector("#hertzle").onclick = () => {
        window.location.href = "https://prototypestudios.neocities.org/hertzle";
      }
      document.querySelector('a').addEventListener('click', function(event) {
        if (event.shiftKey) {
          event.preventDefault();
          const url = this.href;
          navigator.clipboard.writeText(url).then(() => {
            const og = this.textContent;
            this.textContent = "✅ Copied :3";
            setTimeout(() => {this.textContent = og}, 1000);
          }).catch(err => {
            console.error('Failed to copy: ', err);
          });
        }
      });
      document.querySelector("#personalize").onclick = () => {window.location.href = "https://prototypestudios.neocities.org/personalize";}
    </script>
  </body>
</html>
